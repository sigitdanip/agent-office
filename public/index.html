<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Office</title>
<style>
  :root {
    --bg: #000000;
    --bg-panel: #050808;
    --bg-card: #0d1111;
    --bg-hover: #141a1a;
    --border: #1a3a38;
    --border-light: #2a4a48;
    --text: #c8d6d4;
    --text-dim: #6b8a86;
    --text-bright: #e8f0ee;
    --accent: #00b894;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --blue: #74b9ff;
    --gray: #4a6a66;
    --font: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: -apple-system, 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* HEADER */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    height: 40px;
  }
  header h1 {
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
  }
  header h1 span { color: var(--accent); font-weight: 500; }
  #conn-status {
    font-family: var(--font);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  #conn-status.connected { color: var(--accent); border-color: var(--accent); }
  #conn-status.disconnected { color: var(--red); border-color: var(--red); }

  /* TEAM TABS */
  .team-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-left: 16px;
  }
  .team-tab {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .team-tab:hover { color: var(--text-bright); }
  .team-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* LAYOUT */
  .grid {
    display: grid;
    grid-template-columns: 200px 1fr 260px;
    grid-template-rows: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    height: calc(100vh - 40px);
    min-height: 0;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .kanban { grid-column: 2; grid-row: 1 / 3; }

  .panel-header {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 5px 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-body {
    overflow-y: auto;
    padding: 4px;
    flex: 1;
    min-height: 0;
  }

  /* ROSTER */
  .roster { grid-column: 1; grid-row: 1 / 3; }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    transition: background 0.1s;
    cursor: default;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row:hover { background: var(--bg-hover); }
  .profile-badge {
    width: 28px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-size: 10px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    flex-shrink: 0;
    letter-spacing: 1px;
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-size: 13px; font-weight: 500; color: var(--text-bright); }
  .profile-model { font-size: 10px; color: var(--text-dim); font-family: var(--font); letter-spacing: 0px; }
  .profile-status {
    font-family: var(--font);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .status-idle { background: rgba(74,106,102,0.15); color: var(--gray); }
  .status-running { background: rgba(0,184,148,0.12); color: var(--accent); }
  .status-blocked { background: rgba(225,112,85,0.12); color: var(--red); }
  .status-done { background: rgba(74,106,102,0.1); color: var(--gray); }
  .status-ready, .status-todo { background: rgba(116,185,255,0.12); color: var(--blue); }
  .status-brainstorm { background: rgba(155,89,182,0.12); color: #bb8fce; }

  /* KANBAN */
  .kanban-board {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100%;
    padding: 4px 6px;
    white-space: nowrap;
  }
  .kanban-col {
    min-width: 240px;
    width: 260px;
    flex: none;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    white-space: normal;
  }
  .kanban-col-body {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .kanban-col-header {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 7px 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg-panel);
    z-index: 1;
    flex-shrink: 0;
  }
  .kanban-col:first-child .kanban-col-header {
    background: rgba(155,89,182,0.08);
    color: #bb8fce;
    border-bottom-color: rgba(155,89,182,0.3);
  }
  .kanban-col:first-child {
    border-color: rgba(155,89,182,0.2);
  }
  .kanban-col:nth-child(2) .kanban-col-header {
    background: rgba(253,203,110,0.08);
    color: var(--yellow);
    border-bottom-color: rgba(253,203,110,0.3);
  }
  .kanban-col:nth-child(2) {
    border-color: rgba(253,203,110,0.2);
  }
  .kanban-col-count {
    color: var(--text-dim);
    font-size: 11px;
  }
  .task-card {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 4px 5px;
    background: var(--bg-card);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .task-card:hover { border-color: var(--accent); background: var(--bg-hover); }
  .task-title {
    font-size: 13px;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .task-meta {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  .task-badge {
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-ai   { border-color: rgba(116,185,255,0.3); color: var(--blue); }
  .badge-pri { border-color: rgba(225,112,85,0.3); color: var(--red); }
  .badge-tenant {
    font-family: var(--font);
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
    letter-spacing: 0px;
  }

  /* ACTIVITY */
  .activity { grid-column: 3; grid-row: 1; min-height: 0; }
  .event-item {
    padding: 3px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.4;
  }
  .event-item:last-child { border-bottom: none; }
  .event-item:hover { background: var(--bg-hover); }
  .event-kind {
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 6px;
  }
  .kind-created { color: var(--blue); }
  .kind-claimed { color: var(--accent); }
  .kind-spawned { color: var(--accent); }
  .kind-completed { color: var(--gray); }
  .kind-blocked { color: var(--red); }
  .kind-tip { color: var(--yellow); }
  .kind-heartbeat { color: var(--text-dim); }
  .event-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    font-family: var(--font);
  }

  /* STANDUP + CHAT */
  .standup-chat { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .standup-chat .panel { flex: 1; min-height: 0; overflow: hidden; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 8px;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
  .stat-value { font-weight: 600; color: var(--text-bright); font-family: var(--font); }
  .stat-value.run { color: var(--accent); }
  .stat-value.blk { color: var(--red); }
  .stat-value.done { color: var(--gray); }

  .blocker-item {
    padding: 4px 10px;
    margin: 2px 0;
    border-left: 2px solid var(--red);
    font-size: 12px;
    color: var(--red);
  }
  .blockers-header {
    margin-top: 6px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--red);
  }

  .chat-msg {
    padding: 3px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.4;
  }
  .chat-msg:last-child { border-bottom: none; }
  .chat-msg:hover { background: var(--bg-hover); }
  .chat-badge {
    display: inline-block;
    font-family: var(--font);
    font-size: 9px;
    padding: 1px 5px;
    border: 1px solid var(--border-light);
    border-radius: 3px;
    background: var(--bg-card);
    color: var(--text-dim);
    margin-right: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .chat-author { color: var(--accent); font-weight: 500; }
  .chat-body { color: var(--text); margin-top: 1px; }
  .chat-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    font-family: var(--font);
  }

  /* EMPTY STATE */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-close {
    float: right;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: 600;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 6px;
    padding-right: 30px;
  }
  .modal .meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font);
    letter-spacing: 0px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .modal .body {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--text);
  }

  /* MOBILE BOTTOM NAV */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    z-index: 100;
    justify-content: space-around;
    align-items: center;
  }
  .mobile-nav-item {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    cursor: pointer;
    color: var(--text-dim);
    border-top: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    text-align: center;
    flex: 1;
    user-select: none;
  }
  .mobile-nav-item:hover { color: var(--text-bright); }
  .mobile-nav-item.active {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  /* MOBILE BREAKPOINT */
  @media (max-width: 767px) {
    .mobile-nav { display: flex; }

    /* Compact header */
    header {
      padding: 4px 8px;
      height: 36px;
    }
    header h1 { font-size: 13px; }
    .team-tabs { margin-left: 8px; gap: 2px; }
    .team-tab { font-size: 9px; padding: 2px 5px; }
    #conn-status { font-size: 10px; padding: 2px 6px; }

    /* Single-panel grid */
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      height: calc(100vh - 36px - 52px);
      padding: 2px;
      gap: 0;
    }

    /* All panels stack at same grid cell */
    .roster, .kanban, .activity, .standup-chat {
      grid-column: 1;
      grid-row: 1;
    }

    /* Hide all panels by default, show active via body class */
    .kanban, .roster, .activity, .standup-chat { display: none; }

    .mobile-view-board .kanban,
    .mobile-view-team .roster,
    .mobile-view-activity .activity,
    .mobile-view-standup .standup-chat { display: flex; }

    /* Kanban columns narrower on mobile */
    .kanban-board { padding: 4px; gap: 4px; }
    .kanban-col { min-width: 200px; width: 220px; }
    .task-card { padding: 5px 7px; margin: 2px 3px; }
    .task-title { font-size: 12px; }

    /* Profile roster compact */
    .profile-row { padding: 4px 6px; font-size: 11px; }
    .profile-name { font-size: 12px; }
    .profile-badge { width: 24px; height: 20px; font-size: 9px; }

    /* Activity compact */
    .event-item { padding: 3px 6px; font-size: 10px; }

    /* Standup & Chat fill container */
    .standup-chat .panel { flex: 1; }

    /* Modal fits screen */
    .modal { width: 95%; padding: 14px; }
    .modal h2 { font-size: 14px; }
    .modal .body { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>Agent <span>Office</span></h1>
  <div id="team-tabs" class="team-tabs">
    <span class="team-tab active" data-team="dev">Dev Office</span>
    <span class="team-tab" data-team="paper">Paper Office</span>
  </div>
  <div id="conn-status" class="disconnected">Offline</div>
</header>

<div class="grid" id="app">
  <!-- ROSTER -->
  <div class="panel roster">
    <div class="panel-header">Team</div>
    <div class="panel-body" id="roster-list"></div>
  </div>

  <!-- KANBAN -->
  <div class="panel kanban">
    <div class="panel-header"><span>Board</span><span id="task-count" style="font-size:10px;font-weight:400;color:var(--text-dim);font-family:var(--font);"></span></div>
    <div class="panel-body" style="padding:4px;">
      <div class="kanban-board" id="kanban-board"></div>
    </div>
  </div>

  <!-- ACTIVITY -->
  <div class="panel activity">
    <div class="panel-header">Activity</div>
    <div class="panel-body" id="activity-feed"></div>
  </div>

  <!-- STANDUP + CHAT -->
  <div class="standup-chat">
    <div class="panel standup-stats">
      <div class="panel-header">Standup</div>
      <div class="panel-body" id="standup-body"></div>
    </div>
    <div class="panel chat-box">
      <div class="panel-header">Chat</div>
      <div class="panel-body" id="chat-body"></div>
    </div>
  </div>
</div>

<!-- MOBILE NAV -->
<div class="mobile-nav" id="mobile-nav">
  <span class="mobile-nav-item active" data-mview="board">Board</span>
  <span class="mobile-nav-item" data-mview="team">Team</span>
  <span class="mobile-nav-item" data-mview="activity">Activity</span>
  <span class="mobile-nav-item" data-mview="standup">Standup</span>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close-btn">X</button>
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
const BADGES = {
  'ai-engineer':'AI','api-dev':'API','bash-dev':'SH','c-cpp-dev':'CPP',
  'data-dev':'DT','explorer':'EXP','frontend-dev':'FE','infra-dev':'INF',
  'python-dev':'PY','qa-engineer':'QA','researcher':'RCH','workflow-dev':'WF',
  'paper-lead':'PL','paper-researcher':'RCH','paper-writer':'WR',
  'paper-visualizer':'VIZ','paper-reviewer':'RV'
};
function badge(id){return BADGES[id]||'--'}

let state={teams:{dev:{profiles:[],tasks:[],events:[],comments:[],runs:[],links:[],standup:{}},paper:{profiles:[],tasks:[],events:[],comments:[],runs:[],links:[],standup:{}}},activeTeam:'dev'},ws=null;
function current(){return state.teams[state.activeTeam]}

function connect(){
  const url=(typeof __BACKEND_WS__!=='undefined'&&__BACKEND_WS__)?__BACKEND_WS__:`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`;
  ws=new WebSocket(url);
  ws.onopen=()=>{document.getElementById('conn-status').textContent='Connected';document.getElementById('conn-status').className='connected'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'||m.type==='delta'){state.teams=m.data;render()}};
  ws.onclose=()=>{document.getElementById('conn-status').textContent='Offline';document.getElementById('conn-status').className='disconnected';setTimeout(connect,3000)};
  ws.onerror=()=>ws.close();
}
function applyDelta(d){state.teams=d}

const COLUMNS=['brainstorm','triage','todo','ready','running','blocked','done'];
const COLS={brainstorm:'Brainstorm',triage:'Triage',todo:'Todo',ready:'Ready',running:'Running',blocked:'Blocked',done:'Done'};

function render(){renderRoster();renderKanban();renderActivity();renderStandup();renderChat()}

function renderRoster(){
  const el=document.getElementById('roster-list');
  const profiles=current().profiles;
  if(!profiles||!profiles.length){el.innerHTML='<div class="empty-state">No team data</div>';return}
  el.innerHTML=profiles.map(p=>`<div class="profile-row">
    <div class="profile-badge">${badge(p.id)}</div>
    <div class="profile-info"><div class="profile-name">${esc(p.name)}</div><div class="profile-model">${esc(p.model)}</div></div>
    <span class="profile-status status-${p.status||'idle'}">${({running:'Run',blocked:'Blk',idle:'Idle',done:'Done',ready:'Rdy',todo:'Todo',triage:'Trg',brainstorm:'Brm'})[p.status]||p.status}</span>
  </div>`).join('')
}

function renderKanban(){
  const el=document.getElementById('kanban-board'),ce=document.getElementById('task-count');
  const tasks=current().tasks||[];ce.textContent=tasks.length+' tasks';
  el.innerHTML=COLUMNS.map(col=>{
    const items=tasks.filter(t=>t.status===col).sort((a,b)=>(b.priority||0)-(a.priority||0));
    return `<div class="kanban-col"><div class="kanban-col-header"><span>${COLS[col]}</span><span class="kanban-col-count">${items.length}</span></div>
      <div class="kanban-col-body">
      ${items.slice(0,50).map(t=>`<div class="task-card" onclick="showTask('${t.id}')">
        <div class="task-title">${esc(t.title||'Untitled')}</div>
        <div class="task-meta">
          ${t.assignee?`<span class="task-badge badge-${t.assignee.split('-')[0]}">${badge(t.assignee)}</span>`:''}
          <span class="task-badge" style="${t.priority>=2?'color:var(--red);border-color:rgba(225,112,85,0.3)':t.priority===1?'color:var(--yellow);border-color:rgba(253,203,110,0.3)':'color:var(--gray);border-color:var(--border)'}">P${t.priority||0}</span>
          ${t.tenant?`<span class="badge-tenant">${esc(t.tenant)}</span>`:''}
        </div>
      </div>`).join('')}
      ${items.length===0?'<div style="color:var(--text-dim);font-size:11px;padding:20px;text-align:center;font-family:var(--font);letter-spacing:0.5px;">No active tasks</div>':''}
      </div>
    </div>`
  }).join('')
}

function renderActivity(){
  const el=document.getElementById('activity-feed');
  const events=current().events||[];
  if(!events.length){el.innerHTML='<div class="empty-state">No activity</div>';return}
  el.innerHTML=events.slice(-50).reverse().map(e=>{
    let p='';try{p=JSON.parse(e.payload).message||JSON.parse(e.payload).status||''}catch{}
    return `<div class="event-item"><span class="event-kind kind-${e.kind}">${e.kind.toUpperCase()}</span><span style="color:var(--text-dim)">${esc(e.task_id)}</span>${p?'<span style="color:var(--text)"> &mdash; '+esc(p)+'</span>':''}<div class="event-time">${fmt(e.created_at)}</div></div>`
  }).join('')
}

function renderStandup(){
  const el=document.getElementById('standup-body'),s=current().standup;
  if(!s||!s.byStatus){el.innerHTML='<div class="empty-state">No data</div>';return}
  let html=`<div class="stat-row"><span class="stat-label">Queued</span><span class="stat-value">${(s.byStatus.brainstorm||0)+(s.byStatus.triage||0)+(s.byStatus.todo||0)+(s.byStatus.ready||0)}</span></div>
    <div class="stat-row"><span class="stat-label">Running</span><span class="stat-value run">${s.byStatus.running||0}</span></div>
    <div class="stat-row"><span class="stat-label">Blocked</span><span class="stat-value blk">${s.byStatus.blocked||0}</span></div>
    <div class="stat-row"><span class="stat-label">Done</span><span class="stat-value done">${s.byStatus.done||0}</span></div>`;
  if(s.blockers&&s.blockers.length){html+='<div class="blockers-header">Blockers</div>';s.blockers.forEach(t=>{html+=`<div class="blocker-item">[${badge(t.assignee)}] ${esc(t.title)}</div>`})}
  el.innerHTML=html
}

function renderChat(){
  const el=document.getElementById('chat-body'),c=current().comments||[];
  if(!c.length){el.innerHTML='<div class="empty-state">No messages</div>';return}
  el.innerHTML=c.slice(-30).reverse().map(m=>`<div class="chat-msg"><span class="chat-badge">${badge(m.author)}</span><span class="chat-author">${esc(m.author)}</span><div class="chat-body">${esc(m.body)}</div><div class="chat-time">${fmt(m.created_at)}</div></div>`).join('')
}

function showTask(id){
  const t=current().tasks.find(x=>x.id===id);if(!t)return;
  document.getElementById('modal-title').textContent=t.title||'Untitled';
  document.getElementById('modal-meta').innerHTML='ID: '+esc(t.id)+' &nbsp;|&nbsp; Assignee: '+(t.assignee?esc(t.assignee):'--')+' &nbsp;|&nbsp; Status: '+(t.status||'--')+' &nbsp;|&nbsp; P'+(t.priority||0)+(t.tenant?' &nbsp;|&nbsp; Sprint: '+esc(t.tenant):'')+(t.created_at?' &nbsp;|&nbsp; '+fmt(t.created_at):'');
  document.getElementById('modal-body').textContent=t.body||'(No description)';
  document.getElementById('modal-overlay').classList.add('open')
}

function fmt(t){if(!t)return'';return new Date(t*1e3).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}

document.getElementById('modal-close-btn').onclick=()=>document.getElementById('modal-overlay').classList.remove('open');
document.getElementById('modal-overlay').onclick=e=>{if(e.target===e.currentTarget)document.getElementById('modal-overlay').classList.remove('open')};
document.getElementById('team-tabs').onclick=e=>{
  const tab=e.target.closest('.team-tab');
  if(!tab)return;
  const team=tab.dataset.team;
  if(team===state.activeTeam)return;
  state.activeTeam=team;
  document.querySelectorAll('.team-tab').forEach(t=>t.classList.toggle('active',t.dataset.team===team));
  render()
};
// Mobile view switching
document.getElementById('mobile-nav').onclick = function(e) {
  const item = e.target.closest('.mobile-nav-item');
  if (!item) return;
  const view = item.dataset.mview;
  document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.toggle('active', i.dataset.mview === view));
  document.body.className = document.body.className.replace(/mobile-view-\w+/g, '') + ' mobile-view-' + view;
};

// Set initial mobile view
document.body.classList.add('mobile-view-board');

connect();
</script>
</body>
</html>
