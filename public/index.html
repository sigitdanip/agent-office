<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Agent Office</title>
<style>
  :root {
    --bg: #000000;
    --bg-panel: #050808;
    --bg-card: #0d1111;
    --bg-hover: #141a1a;
    --border: #1a3a38;
    --border-light: #2a4a48;
    --text: #c8d6d4;
    --text-dim: #6b8a86;
    --text-bright: #e8f0ee;
    --accent: #00b894;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --blue: #74b9ff;
    --gray: #4a6a66;
    --font: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: -apple-system, 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* HEADER */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    height: 40px;
  }
  header h1 {
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
  }
  header h1 span { color: var(--accent); font-weight: 500; }
  #conn-status {
    font-family: var(--font);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  #conn-status.connected { color: var(--accent); border-color: var(--accent); }
  #conn-status.disconnected { color: var(--red); border-color: var(--red); }

  /* TEAM TABS */
  .team-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-left: 16px;
  }
  .team-tab {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .team-tab:hover { color: var(--text-bright); }
  .team-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* VIEW TABS */
  .view-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-left: 12px;
  }
  .view-tab {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .view-tab:hover { color: var(--text-bright); }
  .view-tab.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  /* LAYOUT */
  .grid {
    display: grid;
    grid-template-columns: 200px 1fr 260px;
    grid-template-rows: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    height: calc(100vh - 40px - 42px);
    min-height: 0;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .kanban { grid-column: 2; grid-row: 1 / 3; }

  /* OVERVIEW / NARRATIVE LINES */
  .overview-panel { grid-column: 2; grid-row: 1 / 3; display: none; }
  .overview-panel.active { display: flex; }
  .kanban.hidden { display: none; }

  .narrative-thread {
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 4px 6px 8px;
    background: var(--bg-card);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .narrative-thread:hover { border-color: var(--border-light); }
  .narrative-thread-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--bg-hover);
    border-bottom: 1px solid var(--border);
  }
  .narrative-agent-badge {
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .narrative-agent-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-bright);
  }
  .narrative-thread-status {
    margin-left: auto;
    font-family: var(--font);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .narrative-thread-body {
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.5;
  }
  .narrative-task-title {
    font-weight: 600;
    color: var(--accent);
    font-family: var(--font);
    font-size: 12px;
  }
  .narrative-task-body {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 4px;
    line-height: 1.4;
    max-height: 60px;
    overflow: hidden;
  }
  .narrative-lines {
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.6;
  }
  .narrative-line {
    display: flex;
    gap: 10px;
    padding: 3px 10px;
    border-top: 1px solid rgba(26,58,56,0.4);
    align-items: flex-start;
  }
  .narrative-time {
    color: var(--gray);
    font-size: 9px;
    white-space: nowrap;
    min-width: 50px;
    padding-top: 1px;
  }
  .narrative-event {
    color: var(--text);
    flex: 1;
  }
  .narrative-event-kind {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 4px;
  }
  .narrative-hb { color: var(--text-dim); font-size: 9px; white-space: nowrap; margin-left: auto; }
  .narrative-section-header {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    padding: 8px 10px 4px;
    border-bottom: 1px solid var(--border);
    margin: 0 6px 8px;
  }
  .narrative-section-header:first-child { margin-top: 2px; }

  .panel-header {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 5px 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-body {
    overflow-y: auto;
    padding: 4px;
    flex: 1;
    min-height: 0;
  }

  /* ROSTER */
  .roster { grid-column: 1; grid-row: 1 / 3; }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    transition: background 0.1s;
    cursor: default;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row:hover { background: var(--bg-hover); }
  .profile-badge {
    width: 28px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-size: 10px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    flex-shrink: 0;
    letter-spacing: 1px;
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-size: 13px; font-weight: 500; color: var(--text-bright); }
  .profile-model { font-size: 10px; color: var(--text-dim); font-family: var(--font); letter-spacing: 0px; }
  .profile-status {
    font-family: var(--font);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .status-idle { background: rgba(74,106,102,0.15); color: var(--gray); }
  .status-running { background: rgba(0,184,148,0.12); color: var(--accent); }
  .status-blocked { background: rgba(225,112,85,0.12); color: var(--red); }
  .status-done { background: rgba(74,106,102,0.1); color: var(--gray); }
  .status-ready, .status-todo { background: rgba(116,185,255,0.12); color: var(--blue); }
  .status-brainstorm { background: rgba(155,89,182,0.12); color: #bb8fce; }
  .status-parking-lot { background: rgba(74,106,102,0.08); color: var(--gray); }

  /* KANBAN */
  .kanban-board {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100%;
    padding: 4px 6px;
    white-space: nowrap;
  }
  .kanban-col {
    min-width: 240px;
    width: 260px;
    flex: none;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    white-space: normal;
  }
  .kanban-col-body {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .kanban-col-header {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 7px 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg-panel);
    z-index: 1;
    flex-shrink: 0;
  }
  .kanban-col:first-child .kanban-col-header {
    background: rgba(74,106,102,0.08);
    color: var(--gray);
    border-bottom-color: rgba(74,106,102,0.2);
  }
  .kanban-col:first-child {
    border-color: rgba(74,106,102,0.15);
  }
  .kanban-col:nth-child(2) .kanban-col-header {
    background: rgba(155,89,182,0.08);
    color: #bb8fce;
    border-bottom-color: rgba(155,89,182,0.3);
  }
  .kanban-col:nth-child(2) {
    border-color: rgba(155,89,182,0.2);
  }
  .kanban-col:nth-child(3) .kanban-col-header {
    background: rgba(253,203,110,0.08);
    color: var(--yellow);
    border-bottom-color: rgba(253,203,110,0.3);
  }
  .kanban-col:nth-child(3) {
    border-color: rgba(253,203,110,0.2);
  }
  .kanban-col-count {
    color: var(--text-dim);
    font-size: 11px;
  }
  .task-card {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 4px 5px;
    background: var(--bg-card);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .task-card:hover { border-color: var(--accent); background: var(--bg-hover); }
  .task-title {
    font-size: 13px;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .task-meta {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  .task-badge {
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-ai   { border-color: rgba(116,185,255,0.3); color: var(--blue); }
  .badge-pri { border-color: rgba(225,112,85,0.3); color: var(--red); }
  .badge-tenant {
    font-family: var(--font);
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
    letter-spacing: 0px;
  }

  /* ACTIVITY */
  .activity { grid-column: 3; grid-row: 1; min-height: 0; }
  .event-item {
    padding: 3px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.4;
  }
  .event-item:last-child { border-bottom: none; }
  .event-item:hover { background: var(--bg-hover); }
  .event-kind {
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 6px;
  }
  .kind-created { color: var(--blue); }
  .kind-claimed { color: var(--accent); }
  .kind-spawned { color: var(--accent); }
  .kind-completed { color: var(--gray); }
  .kind-blocked { color: var(--red); }
  .kind-tip { color: var(--yellow); }
  .kind-heartbeat { color: var(--text-dim); }
  .event-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    font-family: var(--font);
  }

  /* STANDUP + CHAT */
  .standup-chat { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .standup-chat .panel { flex: 1; min-height: 0; overflow: hidden; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 8px;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
  .stat-value { font-weight: 600; color: var(--text-bright); font-family: var(--font); }
  .stat-value.run { color: var(--accent); }
  .stat-value.blk { color: var(--red); }
  .stat-value.done { color: var(--gray); }

  .blocker-item {
    padding: 4px 10px;
    margin: 2px 0;
    border-left: 2px solid var(--red);
    font-size: 12px;
    color: var(--red);
  }
  .blockers-header {
    margin-top: 6px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--red);
  }

  .chat-msg {
    padding: 3px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    line-height: 1.4;
  }
  .chat-msg:last-child { border-bottom: none; }
  .chat-msg:hover { background: var(--bg-hover); }
  .chat-badge {
    display: inline-block;
    font-family: var(--font);
    font-size: 9px;
    padding: 1px 5px;
    border: 1px solid var(--border-light);
    border-radius: 3px;
    background: var(--bg-card);
    color: var(--text-dim);
    margin-right: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .chat-author { color: var(--accent); font-weight: 500; }
  .chat-body { color: var(--text); margin-top: 1px; }
  .chat-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 1px;
    font-family: var(--font);
  }

  /* EMPTY STATE */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-close {
    float: right;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: 600;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 6px;
    padding-right: 30px;
  }
  .modal .meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font);
    letter-spacing: 0px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .modal .body {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--text);
  }

  /* MOBILE BOTTOM NAV */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    z-index: 100;
    justify-content: space-around;
    align-items: center;
  }
  .mobile-nav-item {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 8px;
    cursor: pointer;
    color: var(--text-dim);
    border-top: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    text-align: center;
    flex: 1;
    user-select: none;
  }
  .mobile-nav-item:hover { color: var(--text-bright); }
  .mobile-nav-item.active {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  /* DOT CARDS */
  .dot-cards {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .dot-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: default;
    transition: border-color 0.15s, background 0.15s;
    min-width: 90px;
  }
  .dot-card:hover { border-color: var(--border-light); background: var(--bg-hover); }
  .dot-card-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-card-info { display: flex; flex-direction: column; min-width: 0; }
  .dot-card-label {
    font-family: var(--font);
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.3;
    white-space: nowrap;
  }
  .dot-card-value {
    font-family: var(--font-ui);
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    line-height: 1.2;
  }

  @media (max-width: 767px) {
    .dot-cards { gap: 4px; padding: 4px 6px; }
    .dot-card { padding: 4px 8px; gap: 6px; min-width: 70px; }
    .dot-card-dot { width: 8px; height: 8px; }
    .dot-card-label { font-size: 8px; }
    .dot-card-value { font-size: 14px; }
  }

  /* ── AGENT INSPECTOR PANEL ── */
  .inspector-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
  }
  .inspector-overlay.open { display: block; }

  .inspector-panel {
    position: fixed;
    top: 82px;
    right: 0;
    width: 420px;
    max-width: 90vw;
    height: calc(100vh - 82px);
    background: var(--bg-panel);
    border-left: 1px solid var(--border-light);
    z-index: 160;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  .inspector-panel.open { transform: translateX(0); }

  .inspector-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-panel);
  }
  .inspector-header .profile-badge {
    width: 32px; height: 26px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .inspector-header .inspector-profile-info { flex: 1; min-width: 0; }
  .inspector-header .inspector-profile-name {
    font-size: 14px; font-weight: 600; color: var(--text-bright);
  }
  .inspector-header .inspector-profile-subtitle {
    font-size: 10px; color: var(--text-dim); font-family: var(--font);
  }
  .inspector-close {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); font-size: 16px; cursor: pointer;
    padding: 2px 10px; font-weight: 600; line-height: 1;
  }
  .inspector-close:hover { border-color: var(--red); color: var(--red); }

  .inspector-body {
    overflow-y: auto; flex: 1; min-height: 0;
    padding: 8px;
  }

  .insp-section {
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .insp-section-header {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 10px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
  }
  .insp-section-body { padding: 8px 10px; }

  .insp-kv {
    display: flex; align-items: baseline; gap: 6px;
    padding: 3px 0; font-size: 12px;
  }
  .insp-kv-label {
    font-family: var(--font); font-size: 10px; color: var(--text-dim);
    min-width: 70px; text-transform: uppercase; letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .insp-kv-value { color: var(--text); font-family: var(--font); font-size: 11px; word-break: break-all; }
  .insp-kv-value.cmd { color: var(--accent); }
  .insp-kv-value.err { color: var(--red); }

  .insp-progress { margin-top: 4px; }
  .insp-progress-row {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font); font-size: 10px;
    margin-bottom: 2px;
  }
  .insp-progress-label { color: var(--text-dim); }
  .insp-progress-text { color: var(--text); font-weight: 500; }
  .insp-progress-bar {
    height: 6px; background: var(--bg-hover); border-radius: 3px;
    overflow: hidden; margin: 2px 0 4px;
  }
  .insp-progress-fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.3s ease;
  }
  .insp-progress-fill.error { background: var(--red); }
  .insp-progress-fill.warn { background: var(--yellow); }

  .insp-console {
    background: #08080c;
    border: 1px solid var(--border);
    border-radius: 4px;
    max-height: 180px;
    overflow-y: auto;
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.5;
    padding: 6px 8px;
    color: var(--text-dim);
  }
  .insp-console-line {
    white-space: pre-wrap; word-break: break-all;
    padding: 1px 0;
    border-bottom: 1px solid rgba(26,58,56,0.3);
  }
  .insp-console-line:last-child { border-bottom: none; }
  .insp-console-line .ts {
    color: #4a6a66; margin-right: 8px;
    font-size: 9px;
  }
  .insp-console-line .out { color: #8ab4a8; }
  .insp-console-line .err { color: var(--red); }

  .insp-event {
    padding: 4px 8px; border-bottom: 1px solid var(--border);
    font-size: 11px; line-height: 1.4;
  }
  .insp-event:last-child { border-bottom: none; }
  .insp-event-kind {
    font-family: var(--font); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-right: 4px;
  }

  .insp-run {
    padding: 5px 8px; border-bottom: 1px solid var(--border);
    font-size: 11px; line-height: 1.4;
  }
  .insp-run:last-child { border-bottom: none; }
  .insp-run-outcome {
    font-family: var(--font); font-size: 9px; font-weight: 600;
    text-transform: uppercase; padding: 1px 5px; border-radius: 3px;
    margin-right: 6px;
  }
  .outcome-completed { background: rgba(0,184,148,0.12); color: var(--accent); }
  .outcome-failed { background: rgba(225,112,85,0.12); color: var(--red); }
  .outcome-timed_out { background: rgba(253,203,110,0.12); color: var(--yellow); }
  .outcome-interrupted { background: rgba(116,185,255,0.12); color: var(--blue); }

  .insp-section-empty {
    color: var(--text-dim); font-size: 11px;
    text-align: center; padding: 12px;
    font-family: var(--font); letter-spacing: 0.5px;
  }

  .insp-link {
    color: var(--accent); cursor: pointer; text-decoration: none;
    font-family: var(--font); font-size: 11px;
  }
  .insp-link:hover { text-decoration: underline; }

  /* MOBILE BREAKPOINT */
  @media (max-width: 767px) {
    .inspector-panel {
      width: 100vw; max-width: 100vw;
      top: 36px; height: calc(100vh - 36px - 52px);
    }
    .inspector-overlay.open { display: none; } /* no overlay on mobile, panel covers */
    .inspector-panel .inspector-header { padding: 8px 10px; }
    .inspector-panel .inspector-header .profile-badge { width: 26px; height: 22px; font-size: 10px; }
    .inspector-panel .inspector-header .inspector-profile-name { font-size: 13px; }
    .mobile-nav { display: flex; }

    /* Compact header */
    header {
      padding: 4px 8px;
      height: 36px;
    }
    header h1 { font-size: 13px; }
    .team-tabs { margin-left: 8px; gap: 2px; }
    .team-tab { font-size: 9px; padding: 2px 5px; }
    #conn-status { font-size: 10px; padding: 2px 6px; }

    /* Single-panel grid */
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      height: calc(100vh - 36px - 52px);
      padding: 2px;
      gap: 0;
    }

    /* All panels stack at same grid cell */
    .roster, .kanban, .activity, .standup-chat {
      grid-column: 1;
      grid-row: 1;
    }

    /* Hide all panels by default, show active via body class */
    .kanban, .roster, .activity, .standup-chat { display: none; }

    .mobile-view-board .kanban,
    .mobile-view-team .roster,
    .mobile-view-activity .activity,
    .mobile-view-standup .standup-chat { display: flex; }

    /* Kanban columns narrower on mobile */
    .kanban-board { padding: 4px; gap: 4px; }
    .kanban-col { min-width: 200px; width: 220px; }
    .task-card { padding: 5px 7px; margin: 2px 3px; }
    .task-title { font-size: 12px; }

    /* Profile roster compact */
    .profile-row { padding: 4px 6px; font-size: 11px; }
    .profile-name { font-size: 12px; }
    .profile-badge { width: 24px; height: 20px; font-size: 9px; }

    /* Activity compact */
    .event-item { padding: 3px 6px; font-size: 10px; }

    /* Standup & Chat fill container */
    .standup-chat .panel { flex: 1; }

    /* Modal fits screen */
    .modal { width: 95%; padding: 14px; }
    .modal h2 { font-size: 14px; }
    .modal .body { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>Agent <span>Office</span></h1>
  <div id="team-tabs" class="team-tabs">
    <span class="team-tab active" data-team="dev">Dev Office</span>
    <span class="team-tab" data-team="paper">Paper Office</span>
  </div>
  <div id="view-tabs" class="view-tabs">
    <span class="view-tab active" data-view="overview">Overview</span>
    <span class="view-tab" data-view="board">Board</span>
  </div>
  <div id="conn-status" class="disconnected">Offline</div>
</header>

<div class="dot-cards" id="dot-cards"></div>

<div class="grid" id="app">
  <!-- ROSTER -->
  <div class="panel roster">
    <div class="panel-header">Team</div>
    <div class="panel-body" id="roster-list"></div>
  </div>

  <!-- KANBAN -->
  <div class="panel kanban" id="view-board">
    <div class="panel-header"><span>Board</span><span id="task-count" style="font-size:10px;font-weight:400;color:var(--text-dim);font-family:var(--font);"></span></div>
    <div class="panel-body" style="padding:4px;">
      <div class="kanban-board" id="kanban-board"></div>
    </div>
  </div>

  <!-- OVERVIEW -->
  <div class="panel overview-panel" id="view-overview">
    <div class="panel-header"><span>Overview</span><span id="narrative-count" style="font-size:10px;font-weight:400;color:var(--text-dim);font-family:var(--font);"></span></div>
    <div class="panel-body" id="overview-body"></div>
  </div>

  <!-- ACTIVITY -->
  <div class="panel activity">
    <div class="panel-header">Activity</div>
    <div class="panel-body" id="activity-feed"></div>
  </div>

  <!-- STANDUP + CHAT -->
  <div class="standup-chat">
    <div class="panel standup-stats">
      <div class="panel-header">Standup</div>
      <div class="panel-body" id="standup-body"></div>
    </div>
    <div class="panel chat-box">
      <div class="panel-header">Chat</div>
      <div class="panel-body" id="chat-body"></div>
    </div>
  </div>
</div>

<!-- MOBILE NAV -->
<div class="mobile-nav" id="mobile-nav">
  <span class="mobile-nav-item active" data-mview="board">Board</span>
  <span class="mobile-nav-item" data-mview="team">Team</span>
  <span class="mobile-nav-item" data-mview="activity">Activity</span>
  <span class="mobile-nav-item" data-mview="standup">Standup</span>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close-btn">X</button>
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<!-- AGENT INSPECTOR -->
<div class="inspector-overlay" id="inspector-overlay"></div>
<div class="inspector-panel" id="inspector-panel">
  <div class="inspector-header" id="inspector-header">
    <div class="profile-badge" id="inspector-badge">--</div>
    <div class="inspector-profile-info">
      <div class="inspector-profile-name" id="inspector-name"></div>
      <div class="inspector-profile-subtitle" id="inspector-subtitle"></div>
    </div>
    <button class="inspector-close" id="inspector-close-btn">X</button>
  </div>
  <div class="inspector-body" id="inspector-body"></div>
</div>

<script>
const BADGES = {
  'ai-engineer':'AI','api-dev':'API','bash-dev':'SH','c-cpp-dev':'CPP',
  'data-dev':'DT','dev-lead':'DL','explorer':'EXP','frontend-dev':'FE','infra-dev':'INF',
  'python-dev':'PY','qa-engineer':'QA','researcher':'RCH','workflow-dev':'WF',
  'paper-lead':'PL','paper-researcher':'RCH','paper-writer':'WR',
  'paper-visualizer':'VIZ','paper-reviewer':'RV','paper-technical':'PT'
};
function badge(id){return BADGES[id]||'--'}

let state={teams:{dev:{profiles:[],tasks:[],events:[],comments:[],runs:[],links:[],standup:{}},paper:{profiles:[],tasks:[],events:[],comments:[],runs:[],links:[],standup:{}}},activeTeam:'dev',viewMode:'overview',inspectorProfile:null},ws=null;
function current(){return state.teams[state.activeTeam]}

function connect(){
  const url=(typeof __BACKEND_WS__!=='undefined'&&__BACKEND_WS__)?__BACKEND_WS__:`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`;
  ws=new WebSocket(url);
  ws.onopen=()=>{document.getElementById('conn-status').textContent='Connected';document.getElementById('conn-status').className='connected'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'||m.type==='delta'){state.teams=m.data;render()}};
  ws.onclose=()=>{document.getElementById('conn-status').textContent='Offline';document.getElementById('conn-status').className='disconnected';setTimeout(connect,3000)};
  ws.onerror=()=>ws.close();
}
function applyDelta(d){state.teams=d}

const COLUMNS=['parking-lot','brainstorm','triage','todo','ready','running','blocked','done'];
const COLS={'parking-lot':'Parking Lot',brainstorm:'Brainstorm',triage:'Triage',todo:'Todo',ready:'Ready',running:'Running',blocked:'Blocked',done:'Done'};

function render(){
  renderDotCards();
  renderRoster();
  if(state.viewMode==='overview'){
    if(typeof renderOverview==='function')renderOverview();
    else renderKanban(); // ponytail: fallback if overview not deployed
  }else renderKanban();
  renderActivity();
  renderStandup();
  renderChat();
  renderInspector();
  updateViewVisibility();
}

function updateViewVisibility(){
  const overviewEl=document.getElementById('view-overview');
  const boardEl=document.getElementById('view-board');
  if(state.viewMode==='overview'){
    if(overviewEl)overviewEl.classList.add('active');
    if(boardEl)boardEl.classList.add('hidden');
  }else{
    if(overviewEl)overviewEl.classList.remove('active');
    if(boardEl)boardEl.classList.remove('hidden');
  }
}

function renderDotCards(){
  const el=document.getElementById('dot-cards');
  if(!el)return;
  const tasks=current().tasks||[];
  const profiles=current().profiles||[];
  const blocked=tasks.filter(t=>t.status==='blocked').length;
  const running=tasks.filter(t=>t.status==='running').length;
  const done=tasks.filter(t=>t.status==='done').length;
  const queued=tasks.filter(t=>t.status==='brainstorm'||t.status==='triage'||t.status==='todo'||t.status==='ready').length;
  const parked=tasks.filter(t=>t.status==='parking-lot').length;
  const activeAgents=profiles.filter(p=>p.status==='running').length;
  const total=tasks.length;
  if(!total&&!activeAgents){el.innerHTML='';el.style.display='none';return}
  el.style.display='';
  const cards=[
    {label:'Total',value:total,color:'var(--text-dim)'},
    {label:'Running',value:running,color:'var(--accent)'},
    {label:'Blocked',value:blocked,color:'var(--red)'},
    {label:'Done',value:done,color:'var(--gray)'},
    {label:'Queued',value:queued,color:'var(--blue)'},
    {label:'Parked',value:parked,color:'var(--text-dim)'},
    {label:'Active',value:activeAgents,color:'var(--accent)'}
  ];
  el.innerHTML=cards.map(c=>`<div class="dot-card">
    <div class="dot-card-dot" style="background:${c.color};${c.color==='var(--accent)'?'box-shadow:0 0 6px '+c.color:''}"></div>
    <div class="dot-card-info">
      <span class="dot-card-label">${c.label}</span>
      <span class="dot-card-value">${c.value}</span>
    </div>
  </div>`).join('')
}

function renderRoster(){
  const el=document.getElementById('roster-list');
  const profiles=current().profiles;
  if(!profiles||!profiles.length){el.innerHTML='<div class="empty-state">No team data</div>';return}
  el.innerHTML=profiles.map(p=>`<div class="profile-row" data-profile-id="${esc(p.id)}" style="cursor:pointer;">
    <div class="profile-badge">${badge(p.id)}</div>
    <div class="profile-info"><div class="profile-name">${esc(p.name)}</div><div class="profile-model">${esc(p.model)}</div></div>
    <span class="profile-status status-${p.status||'idle'}">${({running:'Run',blocked:'Blk',idle:'Idle',done:'Done',ready:'Rdy',todo:'Todo',triage:'Trg',brainstorm:'Brm','parking-lot':'Prk'})[p.status]||p.status}</span>
  </div>`).join('')
}

function renderKanban(){
  const el=document.getElementById('kanban-board'),ce=document.getElementById('task-count');
  const tasks=current().tasks||[];ce.textContent=tasks.length+' tasks';
  el.innerHTML=COLUMNS.map(col=>{
    const items=tasks.filter(t=>t.status===col).sort((a,b)=>(b.priority||0)-(a.priority||0));
    return `<div class="kanban-col"><div class="kanban-col-header"><span>${COLS[col]}</span><span class="kanban-col-count">${items.length}</span></div>
      <div class="kanban-col-body">
      ${items.slice(0,50).map(t=>`<div class="task-card" onclick="showTask('${t.id}')">
        <div class="task-title">${esc(t.title||'Untitled')}</div>
        <div class="task-meta">
          ${t.assignee?`<span class="task-badge badge-${t.assignee.split('-')[0]}">${badge(t.assignee)}</span>`:''}
          <span class="task-badge" style="${t.priority>=2?'color:var(--red);border-color:rgba(225,112,85,0.3)':t.priority===1?'color:var(--yellow);border-color:rgba(253,203,110,0.3)':'color:var(--gray);border-color:var(--border)'}">P${t.priority||0}</span>
          ${t.tenant?`<span class="badge-tenant">${esc(t.tenant)}</span>`:''}
        </div>
      </div>`).join('')}
      ${items.length===0?'<div style="color:var(--text-dim);font-size:11px;padding:20px;text-align:center;font-family:var(--font);letter-spacing:0.5px;">No active tasks</div>':''}
      </div>
    </div>`
  }).join('')
}

function renderOverview(){
  const el=document.getElementById('overview-body');
  const ce=document.getElementById('narrative-count');
  const tasks=current().tasks||[];
  const events=current().events||[];
  const runs=current().runs||[];
  const comments=current().comments||[];
  const profiles=current().profiles||[];

  // Build a profile lookup map
  const profileMap={};
  profiles.forEach(p=>{profileMap[p.id]=p});

  // Collect narrative threads: one per task with recent activity
  var recentTaskIds=new Set();
  var recentEvents=events.slice(0,200); // last 200 events
  recentEvents.forEach(function(e){if(e.task_id)recentTaskIds.add(e.task_id)});

  // Also include running and blocked tasks
  tasks.forEach(function(t){
    if(t.status==='running'||t.status==='blocked')recentTaskIds.add(t.id);
  });

  // Get full task objects for recent tasks
  var activeThreads=[];
  recentTaskIds.forEach(function(tid){
    var t=tasks.find(function(x){return x.id===tid});
    if(t)activeThreads.push(t);
  });

  // Sort: running first, then blocked, then by recent event timestamp
  var taskEvents={};
  recentEvents.forEach(function(e){
    if(!taskEvents[e.task_id])taskEvents[e.task_id]=[];
    taskEvents[e.task_id].push(e);
  });
  activeThreads.sort(function(a,b){
    if(a.status==='running'&&b.status!=='running')return -1;
    if(b.status==='running'&&a.status!=='running')return 1;
    if(a.status==='blocked'&&b.status!=='blocked')return -1;
    if(b.status==='blocked'&&a.status!=='blocked')return 1;
    var ae=taskEvents[a.id],be=taskEvents[b.id];
    var at=ae&&ae.length?ae[0].created_at:(a.created_at||0);
    var bt=be&&be.length?be[0].created_at:(b.created_at||0);
    return bt-at;
  });

  if(!activeThreads.length){
    el.innerHTML='<div class="empty-state">No active narratives<br><span style="font-size:10px;color:var(--text-dim);margin-top:4px;">Team activity will appear here as agents work on tasks</span></div>';
    if(ce)ce.textContent='0 threads';
    return;
  }

  if(ce)ce.textContent=activeThreads.length+' threads';

  var html='';

  // Section: Running
  var runningThreads=activeThreads.filter(function(t){return t.status==='running'});
  var blockedThreads=activeThreads.filter(function(t){return t.status==='blocked'});
  var otherThreads=activeThreads.filter(function(t){return t.status!=='running'&&t.status!=='blocked'});

  function renderThread(t){
    var assignee=t.assignee||'';
    var profile=profileMap[assignee];
    var agentName=profile?profile.name:assignee;
    var agentBadge=badge(assignee);
    var te=taskEvents[t.id]||[];
    var statusClass='status-'+t.status;
    var statusLabel=({running:'LIVE',blocked:'BLOCKED',done:'DONE',ready:'READY',todo:'TODO',triage:'TRIAGE',brainstorm:'BRAINSTORM','parking-lot':'PARKED'})[t.status]||t.status.toUpperCase();

    var h='<div class="narrative-thread">';
    h+='<div class="narrative-thread-header">';
    h+='<span class="narrative-agent-badge">'+esc(agentBadge)+'</span>';
    h+='<span class="narrative-agent-name">'+esc(agentName)+'</span>';
    h+='<span class="narrative-thread-status '+statusClass+'">'+statusLabel+'</span>';
    h+='</div>';
    h+='<div class="narrative-thread-body">';
    h+='<div class="narrative-task-title">'+esc(t.title||'Untitled')+'</div>';
    if(t.body)h+='<div class="narrative-task-body">'+esc(t.body).slice(0,120)+'</div>';

    // Narrative event lines
    if(te.length>0){
      h+='<div class="narrative-lines">';
      var shown=te.slice(0,8); // max 8 events per thread
      shown.forEach(function(e){
        var pl='';
        try{var p=JSON.parse(e.payload);pl=p.message||p.command||p.status||p.progress||''}catch(ignore){}
        var kindLabel=e.kind.toUpperCase();
        var kindClass='';
        if(e.kind==='heartbeat'){kindClass=' style="background:rgba(0,184,148,0.1);color:var(--accent)"';}
        else if(e.kind==='completed'){kindClass=' style="background:rgba(0,184,148,0.12);color:var(--accent)"';}
        else if(e.kind==='failed'){kindClass=' style="background:rgba(225,112,85,0.12);color:var(--red)"';}
        else if(e.kind==='blocked'){kindClass=' style="background:rgba(225,112,85,0.12);color:var(--red)"';}
        else{kindClass=' style="background:rgba(74,106,102,0.1);color:var(--text-dim)"';}

        h+='<div class="narrative-line">';
        h+='<span class="narrative-time">'+fmt(e.created_at)+'</span>';
        h+='<span class="narrative-event">';
        h+='<span class="narrative-event-kind"'+kindClass+'>'+kindLabel+'</span>';
        if(pl)h+=esc(String(pl)).slice(0,60);
        h+='</span>';
        h+='</div>';
      });
      if(te.length>8)h+='<div class="narrative-line"><span class="narrative-time"></span><span class="narrative-event" style="color:var(--text-dim);">+ '+(te.length-8)+' more events</span></div>';
      h+='</div>';
    }

    h+='</div></div>';
    return h;
  }

  if(runningThreads.length>0){
    html+='<div class="narrative-section-header">LIVE ('+runningThreads.length+')</div>';
    runningThreads.forEach(function(t){html+=renderThread(t)});
  }
  if(blockedThreads.length>0){
    html+='<div class="narrative-section-header">BLOCKED ('+blockedThreads.length+')</div>';
    blockedThreads.forEach(function(t){html+=renderThread(t)});
  }
  if(otherThreads.length>0){
    html+='<div class="narrative-section-header">RECENT ('+otherThreads.length+')</div>';
    otherThreads.slice(0,10).forEach(function(t){html+=renderThread(t)});
  }

  el.innerHTML=html;
}

function renderActivity(){
  const el=document.getElementById('activity-feed');
  const events=current().events||[];
  if(!events.length){el.innerHTML='<div class="empty-state">No activity</div>';return}
  el.innerHTML=events.slice(0, 50).map(e=>{
    let p='';try{p=JSON.parse(e.payload).message||JSON.parse(e.payload).status||''}catch{}
    return `<div class="event-item"><span class="event-kind kind-${e.kind}">${e.kind.toUpperCase()}</span><span style="color:var(--text-dim)">${esc(e.task_id)}</span>${p?'<span style="color:var(--text)"> &mdash; '+esc(p)+'</span>':''}<div class="event-time">${fmt(e.created_at)}</div></div>`
  }).join('')
}

function renderStandup(){
  const el=document.getElementById('standup-body'),s=current().standup;
  if(!s||!s.byStatus){el.innerHTML='<div class="empty-state">No data</div>';return}
  let html=`<div class="stat-row"><span class="stat-label">Parked</span><span class="stat-value">${s.byStatus['parking-lot']||0}</span></div>
    <div class="stat-row"><span class="stat-label">Queued</span><span class="stat-value">${(s.byStatus.brainstorm||0)+(s.byStatus.triage||0)+(s.byStatus.todo||0)+(s.byStatus.ready||0)}</span></div>
    <div class="stat-row"><span class="stat-label">Running</span><span class="stat-value run">${s.byStatus.running||0}</span></div>
    <div class="stat-row"><span class="stat-label">Blocked</span><span class="stat-value blk">${s.byStatus.blocked||0}</span></div>
    <div class="stat-row"><span class="stat-label">Done</span><span class="stat-value done">${s.byStatus.done||0}</span></div>`;
  if(s.blockers&&s.blockers.length){html+='<div class="blockers-header">Blockers</div>';s.blockers.forEach(t=>{html+=`<div class="blocker-item">[${badge(t.assignee)}] ${esc(t.title)}</div>`})}
  el.innerHTML=html
}

function renderChat(){
  const el=document.getElementById('chat-body'),c=current().comments||[];
  if(!c.length){el.innerHTML='<div class="empty-state">No messages</div>';return}
  el.innerHTML=c.slice(0, 30).map(m=>`<div class="chat-msg"><span class="chat-badge">${badge(m.author)}</span><span class="chat-author">${esc(m.author)}</span><div class="chat-body">${esc(m.body)}</div><div class="chat-time">${fmt(m.created_at)}</div></div>`).join('')
}

function showTask(id){
  const t=current().tasks.find(x=>x.id===id);if(!t)return;
  document.getElementById('modal-title').textContent=t.title||'Untitled';
  document.getElementById('modal-meta').innerHTML='ID: '+esc(t.id)+' &nbsp;|&nbsp; Assignee: '+(t.assignee?esc(t.assignee):'--')+' &nbsp;|&nbsp; Status: '+(t.status||'--')+' &nbsp;|&nbsp; P'+(t.priority||0)+(t.tenant?' &nbsp;|&nbsp; Sprint: '+esc(t.tenant):'')+(t.created_at?' &nbsp;|&nbsp; '+fmt(t.created_at):'');
  document.getElementById('modal-body').textContent=t.body||'(No description)';
  document.getElementById('modal-overlay').classList.add('open')
}

function fmt(t){if(!t)return'';return new Date(t*1e3).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}

// Roster click -> open inspector
document.getElementById('roster-list').onclick=e=>{
  const row=e.target.closest('.profile-row');
  if(row){const pid=row.dataset.profileId;if(pid)showInspector(pid)}
};

// Modal
document.getElementById('modal-close-btn').onclick=()=>document.getElementById('modal-overlay').classList.remove('open');
document.getElementById('modal-overlay').onclick=e=>{if(e.target===e.currentTarget)document.getElementById('modal-overlay').classList.remove('open')};

// Inspector close
document.getElementById('inspector-close-btn').onclick=closeInspector;
document.getElementById('inspector-overlay').onclick=closeInspector;

document.getElementById('team-tabs').onclick=e=>{
  const tab=e.target.closest('.team-tab');
  if(!tab)return;
  const team=tab.dataset.team;
  if(team===state.activeTeam)return;
  state.activeTeam=team;
  document.querySelectorAll('.team-tab').forEach(t=>t.classList.toggle('active',t.dataset.team===team));
  render()
};
// View tabs switching
document.getElementById('view-tabs').onclick=e=>{
  const tab=e.target.closest('.view-tab');
  if(!tab)return;
  const view=tab.dataset.view;
  if(view===state.viewMode)return;
  state.viewMode=view;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  render()
};
// Mobile view switching
document.getElementById('mobile-nav').onclick = function(e) {
  const item = e.target.closest('.mobile-nav-item');
  if (!item) return;
  const view = item.dataset.mview;
  document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.toggle('active', i.dataset.mview === view));
  document.body.className = document.body.className.replace(/mobile-view-\w+/g, '') + ' mobile-view-' + view;
};


// ── AGENT INSPECTOR ──

function showInspector(profileId){
  state.inspectorProfile=profileId;
  document.getElementById('inspector-panel').classList.add('open');
  document.getElementById('inspector-overlay').classList.add('open');
  renderInspector();
}

function closeInspector(){
  state.inspectorProfile=null;
  document.getElementById('inspector-panel').classList.remove('open');
  document.getElementById('inspector-overlay').classList.remove('open');
}

function renderInspector(){
  if(!state.inspectorProfile)return;
  const pid=state.inspectorProfile;
  const p=current().profiles.find(x=>x.id===pid);
  if(!p){closeInspector();return;}

  // Header
  document.getElementById('inspector-badge').textContent=badge(pid);
  document.getElementById('inspector-badge').className='profile-badge';
  document.getElementById('inspector-name').textContent=p.name||pid;
  document.getElementById('inspector-subtitle').innerHTML='Model: '+esc(p.model||'--')+' | Status: <span class="profile-status status-'+(p.status||'idle')+'">'+({running:'Run',blocked:'Blk',idle:'Idle',done:'Done',ready:'Rdy',todo:'Todo',triage:'Trg',brainstorm:'Brm','parking-lot':'Prk'})[p.status||'idle']+'</span>';

  // Find active task for this profile
  const activeTask=p.currentTaskId?(current().tasks.find(t=>t.id===p.currentTaskId)||null):null;
  const events=current().events||[];
  const runs=current().runs||[];

  // Gather heartbeat events for active task
  const taskEvents=activeTask?events.filter(e=>e.task_id===activeTask.id).reverse():[];
  const heartbeats=taskEvents.filter(e=>e.kind==='heartbeat');
  const latestHb=heartbeats.find(e=>{if(!e.payload)return false;try{const p=JSON.parse(e.payload);return p&&typeof p==='object'&&Object.keys(p).length>0}catch{return false}});
  const nonHbEvents=taskEvents.filter(e=>e.kind!=='heartbeat').slice(0,20);

  // Gather profile runs (last 10)
  const profileRuns=runs.filter(r=>r.profile===pid).slice(0,10);

  // Parse heartbeat payload
  let hbPayload={};
  if(latestHb){try{hbp=JSON.parse(latestHb.payload);if(hbp)hbPayload=hbp}catch{}}

  let html='';

  // SECTION: Current Task
  html+='<div class="insp-section">';
  html+='<div class="insp-section-header">Current Task</div>';
  html+='<div class="insp-section-body">';
  if(activeTask){
    html+='<div class="insp-kv"><span class="insp-kv-label">Task</span><a class="insp-link" href="javascript:showTask(\''+esc(activeTask.id)+'\')">'+esc(activeTask.title||'Untitled')+'</a></div>';
    html+='<div class="insp-kv"><span class="insp-kv-label">ID</span><span class="insp-kv-value" style="font-size:10px;color:var(--text-dim)">'+esc(activeTask.id)+'</span></div>';
    html+='<div class="insp-kv"><span class="insp-kv-label">Priority</span><span class="insp-kv-value">P'+(activeTask.priority||0)+'</span></div>';
    if(activeTask.tenant){html+='<div class="insp-kv"><span class="insp-kv-label">Sprint</span><span class="insp-kv-value">'+esc(activeTask.tenant)+'</span></div>';}
  }else{
    html+='<div class="insp-section-empty">No active task</div>';
  }
  html+='</div></div>';

  // SECTION: Live Data
  html+='<div class="insp-section">';
  html+='<div class="insp-section-header">Live Data</div>';
  html+='<div class="insp-section-body">';

  const cmd=p.currentCommand||hbPayload.command||'--';
  html+='<div class="insp-kv"><span class="insp-kv-label">Command</span><span class="insp-kv-value cmd">'+esc(cmd)+'</span></div>';

  const prog=p.currentProgress||hbPayload.progress||'';
  let progPct=hbPayload.progressPct||hbPayload.progressPercent||null;
  if(!progPct&&prog){
    const m=prog.match(/(\d+)\s*%/);
    if(m)progPct=parseInt(m[1]);
    else{
      const parts=prog.match(/(\d+)\s*\/\s*(\d+)/);
      if(parts)progPct=Math.round((parseInt(parts[1])/parseInt(parts[2]))*100);
    }
  }
  html+='<div class="insp-progress">';
  html+='<div class="insp-progress-row"><span class="insp-progress-label">Progress</span><span class="insp-progress-text">'+(typeof progPct==='number'?progPct+'%':(prog||'--'))+'</span></div>';
  if(typeof progPct==='number'){
    html+='<div class="insp-progress-bar"><div class="insp-progress-fill" style="width:'+Math.min(100,Math.max(0,progPct))+'%;"></div></div>';
  }
  html+='</div>';

  const tool=p.currentTool||hbPayload.toolCall||hbPayload.tool||null;
  html+='<div class="insp-kv"><span class="insp-kv-label">Tool</span><span class="insp-kv-value">'+esc(tool||'--')+'</span></div>';

  const skill=p.currentSkill||hbPayload.skill||hbPayload.currentSkill||null;
  html+='<div class="insp-kv"><span class="insp-kv-label">Skill</span><span class="insp-kv-value">'+esc(skill||'--')+'</span></div>';

  const fileEdited=p.fileEdited||hbPayload.fileEdited||hbPayload.file||null;
  html+='<div class="insp-kv"><span class="insp-kv-label">File</span><span class="insp-kv-value" style="font-size:10px;">'+esc(fileEdited||'--')+'</span></div>';

  const errState=hbPayload.errorState||hbPayload.error||null;
  if(errState){
    html+='<div class="insp-kv"><span class="insp-kv-label">Error</span><span class="insp-kv-value err">'+esc(String(errState))+'</span></div>';
  }

  if(hbPayload.sessionDuration!=null){
    const mins=Math.floor(hbPayload.sessionDuration/60);
    const secs=hbPayload.sessionDuration%60;
    html+='<div class="insp-kv"><span class="insp-kv-label">Duration</span><span class="insp-kv-value">'+mins+'m '+secs+'s</span></div>';
  }

  if(hbPayload.model||hbPayload.provider){
    html+='<div class="insp-kv"><span class="insp-kv-label">Model</span><span class="insp-kv-value">'+esc(hbPayload.provider?hbPayload.provider+' / ':'')+esc(hbPayload.model||p.model||'--')+'</span></div>';
  }

  if(hbPayload.contextPct!=null){
    html+='<div class="insp-kv"><span class="insp-kv-label">Context</span><span class="insp-kv-value">'+hbPayload.contextPct+'%</span></div>';
  }

  if(hbPayload.turnCount!=null){
    html+='<div class="insp-kv"><span class="insp-kv-label">Turn</span><span class="insp-kv-value">'+hbPayload.turnCount+(hbPayload.maxTurns?' / '+hbPayload.maxTurns:'')+'</span></div>';
  }

  if(hbPayload.subagentActive!=null){
    html+='<div class="insp-kv"><span class="insp-kv-label">Subagent</span><span class="insp-kv-value" style="color:'+(hbPayload.subagentActive?'var(--accent)':'var(--text-dim)')+';">'+(hbPayload.subagentActive?'Active':'Idle')+'</span></div>';
  }
  if(hbPayload.memoryUpdated!=null){
    html+='<div class="insp-kv"><span class="insp-kv-label">Memory</span><span class="insp-kv-value" style="color:'+(hbPayload.memoryUpdated?'var(--accent)':'var(--text-dim)')+';">'+(hbPayload.memoryUpdated?'Updated':'--')+'</span></div>';
  }

  html+='</div></div>';

  // SECTION: Terminal Output
  html+='<div class="insp-section">';
  html+='<div class="insp-section-header">Terminal Output</div>';
  html+='<div class="insp-section-body">';
  if(heartbeats.length===0){
    html+='<div class="insp-section-empty">No terminal output yet</div>';
  }else{
    html+='<div class="insp-console">';
    heartbeats.slice(0,30).reverse().forEach(hb=>{
      let pl={};
      try{let p=JSON.parse(hb.payload);if(p)pl=p}catch{}
      const ts=fmt(hb.created_at);
      const cmd2=pl.command||'';
      const prog2=pl.progress||'';
      const out=pl.terminalOutput||pl.outputSnippet||pl.output||'';
      const err=pl.errorState||pl.error||'';
      html+='<div class="insp-console-line">';
      html+='<span class="ts">'+ts+'</span>';
      if(cmd2)html+='<span class="out">$ '+esc(cmd2)+'</span>';
      if(prog2)html+=' <span style="color:var(--accent);">['+esc(prog2)+']</span>';
      if(out)html+=' <span class="out">'+esc(out)+'</span>';
      if(err)html+=' <span class="err">'+esc(String(err))+'</span>';
      if(!cmd2&&!out&&!err)html+='<span class="out">heartbeat #'+hb.id+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }
  html+='</div></div>';

  // SECTION: Filtered Event Log
  html+='<div class="insp-section">';
  html+='<div class="insp-section-header">Event Log'+(activeTask?' (Task '+esc(activeTask.id).slice(-8)+')':'')+'</div>';
  html+='<div class="insp-section-body">';
  if(nonHbEvents.length===0){
    html+='<div class="insp-section-empty">No events</div>';
  }else{
    nonHbEvents.forEach(e=>{
      let pl='';try{let p=JSON.parse(e.payload);if(p)pl=p.message||p.status||(typeof p==='string'?p:'')||''}catch{}
      html+='<div class="insp-event">';
      html+='<span class="insp-event-kind kind-'+e.kind+'">'+e.kind.toUpperCase()+'</span>';
      if(pl)html+='<span style="color:var(--text)"> &mdash; '+esc(String(pl))+'</span>';
      html+='<div class="event-time">'+fmt(e.created_at)+'</div>';
      html+='</div>';
    });
  }
  html+='</div></div>';

  // SECTION: Run History
  html+='<div class="insp-section">';
  html+='<div class="insp-section-header">Run History</div>';
  html+='<div class="insp-section-body">';
  if(profileRuns.length===0){
    html+='<div class="insp-section-empty">No runs recorded</div>';
  }else{
    profileRuns.forEach(r=>{
      let outcomeLabel=r.outcome||r.status||'';
      let outcomeClass='';
      if(outcomeLabel==='completed')outcomeClass='outcome-completed';
      else if(outcomeLabel==='failed')outcomeClass='outcome-failed';
      else if(outcomeLabel==='timed_out')outcomeClass='outcome-timed_out';
      else if(outcomeLabel==='interrupted')outcomeClass='outcome-interrupted';
      else outcomeClass='';
      html+='<div class="insp-run">';
      html+='<span class="insp-run-outcome '+outcomeClass+'">'+outcomeLabel.toUpperCase()+'</span>';
      html+='<span style="color:var(--text);">'+(r.summary?esc(r.summary).slice(0,80):(r.task_id?esc(r.task_id):''))+'</span>';
      html+='<div class="event-time">'+fmt(r.started_at)+'</div>';
      html+='</div>';
    });
  }
  html+='</div></div>';

  document.getElementById('inspector-body').innerHTML=html;
}

// Set initial mobile view
document.body.classList.add('mobile-view-board');

connect();
</script>
