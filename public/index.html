<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT OFFICE</title>
<style>
  :root {
    --black: #0a0a0f;
    --dark: #0f0f18;
    --panel: #12121e;
    --border: #1a1a2e;
    --border-bright: #00f0ff;
    --text: #c8ccd4;
    --text-dim: #5a5e72;
    --text-bright: #ffffff;
    --cyan: #00f0ff;
    --green: #00ff88;
    --yellow: #ffcc00;
    --red: #ff3355;
    --blue: #4488ff;
    --gray: #3a3e4e;
    --font: 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    --font-ui: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--black);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray); }

  /* HEADER */
  header {
    background: var(--black);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    height: 48px;
  }
  header h1 {
    font-family: var(--font);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--cyan);
  }
  header h1 span { color: var(--text-dim); font-weight: 400; }
  #conn-status {
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border: 1px solid var(--border);
  }
  #conn-status.connected { color: var(--green); border-color: var(--green); }
  #conn-status.disconnected { color: var(--red); border-color: var(--red); }

  /* LAYOUT */
  .grid {
    display: grid;
    grid-template-columns: 240px 1fr 260px;
    grid-template-rows: 1fr auto;
    gap: 1px;
    padding: 1px;
    height: calc(100vh - 48px);
    min-height: 0;
    background: var(--border);
  }
  .panel {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    font-family: var(--font);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 12px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    background: var(--panel);
  }
  .panel-body {
    overflow-y: auto;
    padding: 4px;
    flex: 1;
    min-height: 0;
    background: var(--dark);
  }

  /* ROSTER */
  .roster { grid-column: 1; grid-row: 1 / 3; }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font);
    font-size: 11px;
    transition: background 0.1s;
  }
  .profile-row:hover { background: rgba(0,240,255,0.03); }
  .profile-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-size: 11px; font-weight: 500; color: var(--text); }
  .profile-model { font-size: 9px; color: var(--text-dim); font-family: var(--font); }
  .profile-status {
    font-family: var(--font);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .status-idle { color: var(--text-dim); border-color: var(--border); }
  .status-running { color: var(--green); border-color: var(--green); }
  .status-blocked { color: var(--red); border-color: var(--red); }
  .status-done { color: var(--gray); border-color: var(--gray); }
  .status-ready, .status-todo { color: var(--blue); border-color: var(--blue); }
  .status-triage { color: var(--yellow); border-color: var(--yellow); }

  /* KANBAN */
  .kanban { grid-column: 2; grid-row: 1; }
  .kanban-board {
    display: flex;
    gap: 1px;
    overflow-x: auto;
    height: 100%;
    background: var(--border);
  }
  .kanban-col {
    min-width: 180px;
    flex: 1;
    background: var(--dark);
  }
  .kanban-col-header {
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 8px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--dark);
    z-index: 1;
  }
  .kanban-col-count {
    color: var(--text-dim);
    font-size: 9px;
  }
  .task-card {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .task-card:hover { background: rgba(0,240,255,0.04); }
  .task-title {
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 4px;
  }
  .task-meta {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .task-badge {
    font-family: var(--font);
    font-size: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .task-badge.assignee { border-color: currentColor; }
  .badge-high { color: var(--red); border-color: var(--red); }
  .badge-med { color: var(--yellow); border-color: var(--yellow); }
  .badge-low { color: var(--green); border-color: var(--green); }
  .task-tenant {
    font-family: var(--font);
    font-size: 8px;
    color: var(--text-dim);
    margin-left: auto;
  }

  /* ACTIVITY */
  .activity { grid-column: 3; grid-row: 1; }
  .event-item {
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.4;
  }
  .event-item:hover { background: rgba(0,240,255,0.02); }
  .event-kind {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 1px 4px;
    margin-right: 4px;
  }
  .kind-created { color: var(--blue); }
  .kind-claimed { color: var(--cyan); }
  .kind-spawned { color: var(--green); }
  .kind-completed { color: var(--gray); }
  .kind-blocked { color: var(--red); }
  .kind-tip { color: var(--yellow); }
  .kind-heartbeat { color: var(--text-dim); }
  .event-time {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* STANDUP + CHAT (right bottom) */
  .standup-chat { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; }
  .standup-chat .panel { flex: 1; min-height: 0; overflow: hidden; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 8px;
    font-family: var(--font);
    font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .stat-label { color: var(--text-dim); }
  .stat-value { font-weight: 600; color: var(--text-bright); }
  .stat-value.running { color: var(--green); }
  .stat-value.blocked { color: var(--red); }
  .stat-value.done { color: var(--gray); }

  .blocker-item {
    padding: 4px 8px;
    margin: 2px 0;
    border-left: 2px solid var(--red);
    font-family: var(--font);
    font-size: 10px;
    color: var(--red);
  }

  .chat-msg {
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.4;
  }
  .chat-msg:hover { background: rgba(0,240,255,0.02); }
  .chat-author {
    color: var(--cyan);
    font-weight: 600;
  }
  .chat-body { color: var(--text); margin-top: 2px; }
  .chat-time {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .chat-author-badge {
    display: inline-block;
    font-size: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 0 4px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-right: 4px;
  }

  /* EMPTY STATE */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 11px;
    text-align: center;
    padding: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-bright);
    padding: 24px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: var(--font);
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--cyan);
    margin-bottom: 8px;
  }
  .modal .meta {
    font-family: var(--font);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  .modal .body {
    font-family: var(--font);
    font-size: 11px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--text);
  }
  .modal-close {
    float: right;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 8px;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }

  /* RESPONSIVE */
  @media (max-width: 1024px) {
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      height: auto;
    }
    .roster, .kanban, .activity, .standup-chat { grid-column: 1; }
    .kanban-board { overflow-x: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>AGENT <span>OFFICE</span></h1>
  <div id="conn-status" class="disconnected">OFFLINE</div>
</header>

<div class="grid" id="app">
  <!-- ROSTER -->
  <div class="panel roster">
    <div class="panel-header">TEAM ROSTER</div>
    <div class="panel-body" id="roster-list"></div>
  </div>

  <!-- KANBAN -->
  <div class="panel kanban">
    <div class="panel-header"><span>KANBAN</span><span id="task-count" style="font-size:10px;font-weight:400;"></span></div>
    <div class="panel-body">
      <div class="kanban-board" id="kanban-board"></div>
    </div>
  </div>

  <!-- ACTIVITY -->
  <div class="panel activity">
    <div class="panel-header">ACTIVITY</div>
    <div class="panel-body" id="activity-feed"></div>
  </div>

  <!-- STANDUP + CHAT -->
  <div class="standup-chat">
    <div class="panel standup-stats">
      <div class="panel-header">STANDUP</div>
      <div class="panel-body" id="standup-body"></div>
    </div>
    <div class="panel chat-box">
      <div class="panel-header">CHAT</div>
      <div class="panel-body" id="chat-body"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close-btn">X</button>
    <h2 id="modal-title"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
// ---- STATE ----
let state = { profiles: [], tasks: [], events: [], comments: [], runs: [], links: [], standup: {} };
let ws = null;

// ---- PROFILE BADGES (short text, no emojis) ----
const BADGES = {
  'ai-engineer':  'AI',
  'api-dev':      'API',
  'bash-dev':     'SH',
  'c-cpp-dev':    'CPP',
  'data-dev':     'DT',
  'explorer':     'EXP',
  'frontend-dev': 'FE',
  'infra-dev':    'INF',
  'python-dev':   'PY',
  'qa-engineer':  'QA',
  'researcher':   'RCH',
  'workflow-dev': 'WF',
};

function badge(id) { return BADGES[id] || '--'; }

// ---- WEBSOCKET ----
function connect() {
  const url = (typeof __BACKEND_WS__ !== 'undefined' && __BACKEND_WS__)
    ? __BACKEND_WS__
    : `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById('conn-status').textContent = 'CONNECTED';
    document.getElementById('conn-status').className = 'connected';
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'snapshot') { state = msg.data; render(); }
    else if (msg.type === 'delta') { applyDelta(msg.data); render(); }
  };
  ws.onclose = () => {
    document.getElementById('conn-status').textContent = 'OFFLINE';
    document.getElementById('conn-status').className = 'disconnected';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

function applyDelta(d) {
  if (d.fullSnapshot) { state = d.fullSnapshot; return; }
  if (d.newEvents) state.events = [...state.events, ...d.newEvents].slice(-100);
  if (d.newComments) state.comments = [...state.comments, ...d.newComments].slice(-50);
}

// ---- HELPERS ----
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 10) return 'now';
  if (s < 60) return s+'s';
  if (s < 3600) return Math.floor(s/60)+'m';
  if (s < 86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts*1000).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'});
}
function statusLabel(s) {
  const m = { running:'RUN', blocked:'BLK', idle:'IDLE', done:'DONE', ready:'RDY', todo:'TODO', triage:'TRG' };
  return m[s] || s;
}
function priorityLabel(p) {
  if (p >= 2) return 'HIGH';
  if (p === 1) return 'MED';
  return 'LOW';
}
function priorityBadgeClass(p) {
  if (p >= 2) return 'badge-high';
  if (p === 1) return 'badge-med';
  return 'badge-low';
}
function kindLabel(k) {
  return k ? k.toUpperCase() : '';
}

// ---- RENDER ----
function render() {
  renderRoster();
  renderKanban();
  renderActivity();
  renderStandup();
  renderChat();
}

function renderRoster() {
  const el = document.getElementById('roster-list');
  if (!state.profiles || state.profiles.length === 0) {
    el.innerHTML = '<div class="empty-state">NO PROFILES</div>'; return; }
  el.innerHTML = state.profiles.map(p => `
    <div class="profile-row">
      <div class="profile-icon">${badge(p.id)}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(p.name)}</div>
        <div class="profile-model">${esc(p.model)}</div>
      </div>
      <span class="profile-status ${statusClass(p.status)}">${statusLabel(p.status)}</span>
    </div>`).join('');
}

const COLUMNS = ['triage','todo','ready','running','blocked','done'];
const COL_LABELS = { triage:'TRG', todo:'TODO', ready:'RDY', running:'RUN', blocked:'BLK', done:'DONE' };

function renderKanban() {
  const el = document.getElementById('kanban-board');
  const countEl = document.getElementById('task-count');
  const tasks = state.tasks || [];
  countEl.textContent = tasks.length+' TASKS';
  el.innerHTML = COLUMNS.map(col => {
    const items = tasks.filter(t => t.status === col).sort((a,b) => (b.priority||0)-(a.priority||0));
    return `<div class="kanban-col">
      <div class="kanban-col-header"><span>${COL_LABELS[col]}</span><span class="kanban-col-count">${items.length}</span></div>
      ${items.slice(0,40).map(t => `<div class="task-card" onclick="showTask('${t.id}')">
        <div class="task-title">${esc(t.title||'UNTITLED')}</div>
        <div class="task-meta">
          ${t.assignee ? `<span class="task-badge assignee" style="border-color:currentColor">${badge(t.assignee)}</span>` : ''}
          <span class="task-badge ${priorityBadgeClass(t.priority)}">${priorityLabel(t.priority)}</span>
          ${t.tenant ? `<span class="task-tenant">${esc(t.tenant)}</span>` : ''}
        </div>
      </div>`).join('')}
      ${items.length === 0 ? '<div style="color:var(--text-dim);font-family:var(--font);font-size:9px;padding:12px;text-align:center;letter-spacing:1px;">EMPTY</div>' : ''}
    </div>`;
  }).join('');
}

function renderActivity() {
  const el = document.getElementById('activity-feed');
  const events = state.events || [];
  if (events.length === 0) { el.innerHTML = '<div class="empty-state">NO EVENTS</div>'; return; }
  el.innerHTML = events.slice(-50).reverse().map(e => {
    let payload = '';
    try { const p = JSON.parse(e.payload); payload = p.message || p.status || ''; } catch {}
    return `<div class="event-item">
      <span class="event-kind kind-${e.kind}">${kindLabel(e.kind)}</span>
      <span class="task-id" style="color:var(--text-dim)">${esc(e.task_id)}</span>
      ${payload ? '<span style="color:var(--text)"> — '+esc(payload)+'</span>' : ''}
      <div class="event-time">${fmtTime(e.created_at)}</div>
    </div>`;
  }).join('');
}

function renderStandup() {
  const el = document.getElementById('standup-body');
  const s = state.standup;
  if (!s || !s.byStatus) { el.innerHTML = '<div class="empty-state">NO DATA</div>'; return; }
  let html = `
    <div class="stat-row"><span class="stat-label">QUEUED</span><span class="stat-value">${(s.byStatus.triage||0)+(s.byStatus.todo||0)+(s.byStatus.ready||0)}</span></div>
    <div class="stat-row"><span class="stat-label">RUNNING</span><span class="stat-value running">${s.byStatus.running||0}</span></div>
    <div class="stat-row"><span class="stat-label">BLOCKED</span><span class="stat-value blocked">${s.byStatus.blocked||0}</span></div>
    <div class="stat-row"><span class="stat-label">DONE</span><span class="stat-value done">${s.byStatus.done||0}</span></div>`;
  if (s.blockers && s.blockers.length > 0) {
    html += '<div style="margin-top:8px;font-size:9px;font-weight:600;letter-spacing:1px;color:var(--red);padding:4px 8px;">BLOCKERS</div>';
    s.blockers.forEach(t => {
      html += `<div class="blocker-item">[${badge(t.assignee)}] ${esc(t.title)}</div>`;
    });
  }
  el.innerHTML = html;
}

function renderChat() {
  const el = document.getElementById('chat-body');
  const comments = state.comments || [];
  if (comments.length === 0) { el.innerHTML = '<div class="empty-state">NO MESSAGES</div>'; return; }
  el.innerHTML = comments.slice(-30).reverse().map(c => `
    <div class="chat-msg">
      <span class="chat-author-badge">${badge(c.author)}</span>
      <span class="chat-author">${esc(c.author)}</span>
      <div class="chat-body">${esc(c.body)}</div>
      <div class="chat-time">${fmtTime(c.created_at)}</div>
    </div>`).join('');
}

// ---- MODAL ----
function showTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = t.title || 'UNTITLED';
  document.getElementById('modal-meta').innerHTML =
    'ID: '+esc(t.id)+' | ASSIGNEE: '+(t.assignee?esc(t.assignee):'--')+
    ' | STATUS: '+(t.status||'--')+' | PRIORITY: P'+(t.priority||0)+
    (t.tenant?' | SPRINT: '+esc(t.tenant):'')+
    (t.created_at?' | CREATED: '+fmtTime(t.created_at):'');
  document.getElementById('modal-body').textContent = t.body || '(NO DESCRIPTION)';
  document.getElementById('modal-overlay').classList.add('open');
}

// ---- UTILITIES ----
function statusClass(s) { return 'status-'+(s||'idle'); }
function esc(s) { if (!s) return ''; var d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }

// ---- INIT ----
document.getElementById('modal-close-btn').onclick = () => document.getElementById('modal-overlay').classList.remove('open');
document.getElementById('modal-overlay').onclick = (e) => { if (e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('open'); };
connect();
</script>
</body>
</html>
